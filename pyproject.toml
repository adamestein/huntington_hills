[project]
name = "huntingtonhills"
version = "4.1.2"
requires-python = ">=3.13"
dependencies = []

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "hh.settings"
pythonpath = ["apps"]
testpaths = ["apps"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests (no browser)",
    "behavior: Behavior/integration tests (Playwright)",
]

